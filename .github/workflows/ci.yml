name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: stable
            - run: cargo check --all-targets
